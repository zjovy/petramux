<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>petramux</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="drag" data-tauri-drag-region></div>
        <nav id="list"></nav>
        <button id="update" hidden title="A newer build is ready. Restart to install it: every session keeps running."><span>↻</span><span class="label">Restart to update</span></button>
        <button id="new"><span>+</span><span class="label">New session</span><kbd>⌘N</kbd></button>
      </aside>
      <main id="main">
        <div class="drag top" data-tauri-drag-region>
          <span id="where" data-tauri-drag-region></span>
          <button id="search" title="Every session and command"><span>Search sessions and commands</span><kbd>⌘⇧P</kbd></button>
          <span class="right" data-tauri-drag-region><span id="status"></span><button id="gear" title="Settings (⌘,)">⚙</button></span>
        </div>
        <div id="terms"></div>
        <div id="empty"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
