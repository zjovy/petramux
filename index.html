<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>petramux</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="drag" data-tauri-drag-region></div>
        <button id="search" class="nav" title="Every session and command (⌘⇧P)">
          <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.75" /><path d="m10.5 10.5 3 3" /></svg>
          <span class="label">Search</span><kbd>⌘⇧P</kbd>
        </button>
        <button id="new" class="nav" title="New session (⌘N)">
          <svg viewBox="0 0 16 16"><path d="M13 9v3.25c0 .97-.78 1.75-1.75 1.75h-7.5C2.78 14 2 13.22 2 12.25v-7.5C2 3.78 2.78 3 3.75 3H7" /><path d="m11.75 2.25 2 2L8 10H6V8z" /></svg>
          <span class="label">New session</span><kbd>⌘N</kbd>
        </button>
        <div class="section">Sessions</div>
        <nav id="list"></nav>
        <button id="update" class="nav" hidden title="A newer build is ready. Restart to install it: every session keeps running.">
          <svg viewBox="0 0 16 16"><path d="M13.25 8a5.25 5.25 0 1 1-1.54-3.71" /><path d="M13.25 2.5v2.75H10.5" /></svg>
          <span class="label">Restart to update</span>
        </button>
      </aside>
      <main id="main">
        <div class="drag top" data-tauri-drag-region>
          <button id="side" title="Collapse the sidebar (⌘B)">
            <svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.75" /><path d="M6 3v10" /></svg>
          </button>
          <span id="where" data-tauri-drag-region></span>
          <span class="right" data-tauri-drag-region>
            <span id="status"></span>
            <button id="chatbtn" title="Workspace chat (⌘⇧C)">
              <svg viewBox="0 0 16 16"><path d="M2.75 4.25c0-.83.67-1.5 1.5-1.5h7.5c.83 0 1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5H7.5L4.75 13v-2.25h-.5c-.83 0-1.5-.67-1.5-1.5z" /></svg>
            </button>
            <button id="gear" title="Settings (⌘,)">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2" /><path d="M8 1.75v1.5M8 12.75v1.5M14.25 8h-1.5M3.25 8h-1.5M12.42 3.58l-1.06 1.06M4.64 11.36l-1.06 1.06M12.42 12.42l-1.06-1.06M4.64 4.64 3.58 3.58" /></svg>
            </button>
          </span>
        </div>
        <div id="work">
          <div id="terms"></div>
          <aside id="chat" hidden>
            <div class="chat-top">
              <span class="chat-name"></span>
              <button class="chat-close" title="Close the chat (⌘⇧C)">
                <svg viewBox="0 0 16 16"><path d="m4.5 4.5 7 7m0-7-7 7" /></svg>
              </button>
            </div>
            <div class="chat-log"></div>
            <textarea rows="2" spellcheck="true"></textarea>
          </aside>
        </div>
        <div id="empty"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
